        consent_given_at:
          type: string
          format: date-time
        consent_withdrawn_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - must_set_password
      - created_at
    students:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        roll_no:
          type: string
        full_name:
          type: string
        department:
          type: string
      required:
      - id
      - user_id
      - roll_no
      - full_name
    courses:
      type: object
      properties:
        id:
